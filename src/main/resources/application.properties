# Server Configuration
server.port=8080
server.servlet.context-path=/

# Spring MVC JSP Configuration
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# H2 Database Configuration (In-Memory with Sample Data)
spring.datasource.url=jdbc:h2:mem:hospitaldb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Spring JDBC SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# H2 Web Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# AOP and Logging Configuration
logging.level.root=INFO
logging.level.com.hospital=DEBUG
logging.level.org.springframework.jdbc=INFO

# Application Performance Monitoring Threshold (Milliseconds)
hospital.performance.threshold-ms=20
